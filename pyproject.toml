[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"


[project]
name = "geo-raster-toolkit"
version = "0.1.0"
description = "An open-source Python toolkit for geospatial raster analysis and remote sensing workflows."
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [
    {name = "Leo Paul"}
]
dependencies = [
    "numpy>=1.24"
]


[project.optional-dependencies]
test = [
    "pytest>=7.0"
]


[tool.pytest.ini_options]
testpaths = ["tests"]
